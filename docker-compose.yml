version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: g-scores-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: g_scores
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g_scores"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: g-scores-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/g_scores?sslmode=disable
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    # Auto run migrations and seed data on startup, then start the server
    entrypoint: >
      sh -c "
        pnpm db:migrate:prod &&
        pnpm db:seed &&
        pnpm start:prod
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: g-scores-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
